name: BarberJob Matrix CI

on:
  push:
    paths:
      - "barberjob_matrix/**"
      - ".github/workflows/barberjob-matrix.yml"
  pull_request:
    paths:
      - "barberjob_matrix/**"
      - ".github/workflows/barberjob-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barberjob_matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run automated tests
        run: pytest
