name: Bounty Tours read-only preflight

on:
  pull_request:
    paths:
      - "bounty_tours/**"
      - ".github/workflows/bounty-tours-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contract JSON and Python syntax
        run: |
          python -m json.tool bounty_tours/CONTRACT_V1.json >/dev/null
          python -m py_compile bounty_tours/preflight_check.py
      - name: Run read-only DNS, TLS, and HTTPS checks
        id: preflight
        shell: bash
        run: |
          set +e
          python bounty_tours/preflight_check.py | tee bounty_tours/preflight-result.json
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload raw preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-tours-preflight-report
          path: bounty_tours/preflight-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce frozen technical pass/fail rule
        if: steps.preflight.outputs.exit_code != '0'
        run: |
          echo "Bounty Tours technical preflight did not pass. Inspect the uploaded JSON report; do not infer the cause."
          exit 1
